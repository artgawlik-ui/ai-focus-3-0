# Existing ai-focus-3-0-db is reused; no new database is created by this Blueprint.
# Approved base cost: web $7/mo + existing PostgreSQL $6/mo.
services:
  - type: web
    name: ai-focus-3-0
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        fromService:
          name: ai-focus-3-0
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: ai-focus-3-0-db
          property: connectionString
      - key: BOOTSTRAP_EMAIL
        value: art.gawlik@gmail.com
      - key: BOOTSTRAP_NAME
        value: Menedżer
      - key: BOOTSTRAP_PASSWORD
        generateValue: true
