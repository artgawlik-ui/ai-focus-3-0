# REVIEW ONLY: paid resources. Do not apply without explicit cost approval.
services:
  - type: web
    name: ai-focus-3-0
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-focus-3-0-db
          property: connectionString
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
  - type: worker
    name: ai-focus-3-0-agent
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerCommand: python -m backend.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-focus-3-0-db
          property: connectionString
      # OPENAI_API_KEY deliberately omitted: enabling paid model usage requires approval.
databases:
  - name: ai-focus-3-0-db
    databaseName: ai_focus_3_0
    user: ai_focus_3_0
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
