# Approved budget: approximately $13/month. API and agent use independent supervised processes.
services:
  - type: web
    name: ai-focus-3-0
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-focus-3-0-db
          property: connectionString
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
databases:
  - name: ai-focus-3-0-db
    databaseName: ai_focus_3_0
    user: ai_focus_3_0
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
