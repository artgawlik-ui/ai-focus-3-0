name: Verify Focus 3
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: focus3_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/focus3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements.txt pytest pip-audit playwright
      - run: alembic upgrade head
      - run: pytest -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m tests.ci_e2e
      - run: npm audit --prefix frontend
      - run: pip-audit -r requirements.txt --format=json --output=test-results/pip-audit-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: test-results/
