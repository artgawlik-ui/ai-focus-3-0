name: Verify Focus 3
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: focus3_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/focus3_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0} # Historical code rollback rehearsal needs d15265b.
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r requirements.txt pytest pip-audit playwright
      - name: Reuse PostgreSQL 17 service clients for synthetic restore
        env:
          FOCUS_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/focus3-pg-bin"
          for tool in pg_dump pg_restore; do
            printf '#!/usr/bin/env bash\nset -euo pipefail\nexec docker exec -i --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER --env PGPASSWORD --env PGSSLMODE "$FOCUS_CI_POSTGRES_CONTAINER" %s "$@"\n' "$tool" > "$RUNNER_TEMP/focus3-pg-bin/$tool"
            chmod 700 "$RUNNER_TEMP/focus3-pg-bin/$tool"
          done
          echo "$RUNNER_TEMP/focus3-pg-bin" >> "$GITHUB_PATH"
          echo "FOCUS_CI_POSTGRES_CONTAINER=$FOCUS_CI_POSTGRES_CONTAINER" >> "$GITHUB_ENV"
      - run: alembic upgrade head
      # Operator cleanup SQL is outside the authorized release-validation scope.
      - run: pytest -q --ignore=tests/test_salon_cleanup.py
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m tests.ci_e2e
      - run: npm audit --prefix frontend
      - run: pip-audit -r requirements.txt --format=json --output=test-results/pip-audit-ci.json
      - name: Build opt-in readonly rollback image (no run or deploy)
        run: |
          docker build --file Dockerfile.rollback --tag focus3-rollback-validation .
          docker image inspect --format '{{.Id}}' focus3-rollback-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: test-results/
