name: Approved issue to Codex
on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  admission:
    if: >-
      github.repository == 'artgawlik-ui/ai-focus-3-0' &&
      vars.FOCUS_CODEX_AUTOMATION_ENABLED == 'true' &&
      vars.FOCUS_CODEX_COSTS_APPROVED == 'true' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/codex approve ')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # atomic reservation only; no candidate code is executed
      issues: read
      actions: read # read environment protection metadata
    outputs:
      base: ${{ steps.admit.outputs.base }}
      branch: ${{ steps.admit.outputs.branch }}
      number: ${{ steps.admit.outputs.number }}
      digest: ${{ steps.admit.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_ENABLED: ${{ vars.FOCUS_CODEX_AUTOMATION_ENABLED }}
          COSTS_APPROVED: ${{ vars.FOCUS_CODEX_COSTS_APPROVED }}
        run: python scripts/codex_automation/pipeline.py admit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-task-${{ github.run_id }}
          path: task/
          retention-days: 1
          if-no-files-found: error
  codex:
    needs: admission
    concurrency:
      group: focus-codex-paid-executor
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: codex-development
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read # read only the private controller's reservation receipt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.admission.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: approved-task-${{ github.run_id }}
          path: task
      - name: Check activation prerequisites without printing values
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.FOCUS_CODEX_MODEL }}
        run: |
          test -n "$API_KEY" || { echo 'BLOCKED: API_AUTH_MISSING'; exit 1; }
          test -n "$MODEL" || { echo 'BLOCKED: APPROVED_MODEL_MISSING'; exit 1; }
      # The private controller reads live costs before committing any reservation.
      # A verified receipt below is mandatory; do not duplicate the Costs API GET here.
      - name: Prepare immutable private budget request
        env:
          FOCUS_PRIVATE_TRANSPORT_ENABLED: ${{ vars.FOCUS_PRIVATE_TRANSPORT_ENABLED }}
          APPROVED_NUMBER: ${{ needs.admission.outputs.number }}
          APPROVED_BASE: ${{ needs.admission.outputs.base }}
          APPROVED_BRANCH: ${{ needs.admission.outputs.branch }}
          APPROVED_DIGEST: ${{ needs.admission.outputs.digest }}
        run: python scripts/codex_automation/github_budget_transport.py request
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: budget-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: budget-request/request.json
          retention-days: 1
          if-no-files-found: error
      - name: Wait for private PostgreSQL reservation receipt
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_PRIVATE_TRANSPORT_ENABLED: ${{ vars.FOCUS_PRIVATE_TRANSPORT_ENABLED }}
        run: python scripts/codex_automation/github_budget_transport.py wait
      - name: Require private admission transport (not provisioned)
        run: |
          echo "BLOCKED: PRIVATE_ADMISSION_TRANSPORT_REQUIRED"
          exit 1
      # Remains after the unconditional activation barrier; no paid API in CI.
      - name: Start private bounded executor gateway
        env:
          FOCUS_EXECUTOR_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          state_dir="/run/focus-codex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Privileged gateway and ledger survive drop-sudo; key never reaches CLI.
          printf '%s\n' "$FOCUS_EXECUTOR_API_KEY" | \
            env -u FOCUS_EXECUTOR_API_KEY sudo -n /usr/bin/python3 scripts/codex_automation/executor_limits.py \
              --policy scripts/codex_automation/executor-limits.json \
              --state-dir "$state_dir" > "$RUNNER_TEMP/focus-limit-gate.log" 2>&1 &
          gate_pid=$!
          unset FOCUS_EXECUTOR_API_KEY
          for attempt in {1..20}; do
            if test -f "$RUNNER_TEMP/focus-limit-gate.log" && \
               grep -q '^EXECUTOR_LIMIT_GATE_READY$' "$RUNNER_TEMP/focus-limit-gate.log"; then
              exit 0
            fi
            kill -0 "$gate_pid" 2>/dev/null || { echo 'BLOCKED: EXECUTOR_LIMIT_GATE_NOT_READY'; exit 1; }
            sleep 0.1
          done
          echo 'BLOCKED: EXECUTOR_LIMIT_GATE_NOT_READY'
          exit 1
      - name: Real Codex executor (no mock fallback)
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          # Real key stays in the root-owned gateway; action gets a dummy.
          openai-api-key: 'focus-bounded-local-proxy'
          responses-api-endpoint: 'http://127.0.0.1:8765/responses'
          codex-version: '0.167.0'
          codex-args: '["-c","web_search=\"disabled\""]'
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: false
          model: ${{ vars.FOCUS_CODEX_MODEL }}
          prompt-file: task/prompt.txt
      - name: Collect untrusted proposal only
        run: |
          mkdir -p "$RUNNER_TEMP/proposal"
          git -c core.hooksPath=/dev/null add -N -- backend frontend/src tests docs
          git -c core.hooksPath=/dev/null diff --no-renames --binary --no-ext-diff HEAD > "$RUNNER_TEMP/proposal/changes.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: untrusted-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal/changes.patch
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [admission, codex]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.admission.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: untrusted-proposal-${{ github.run_id }}
          path: proposal
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_NUMBER: ${{ needs.admission.outputs.number }}
          APPROVED_BASE: ${{ needs.admission.outputs.base }}
          APPROVED_BRANCH: ${{ needs.admission.outputs.branch }}
          APPROVED_DIGEST: ${{ needs.admission.outputs.digest }}
        run: python scripts/codex_automation/pipeline.py publish
  validation:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: focus3_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/focus3_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: pip install -r requirements.txt pytest pip-audit playwright
      - run: alembic upgrade head
      - run: pytest -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m tests.ci_e2e
      - run: npm audit --prefix frontend
      - run: pip-audit -r requirements.txt
  report:
    needs: [admission, codex, publish, validation]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.admission.outputs.base }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.number }}
          CANDIDATE_SHA: ${{ needs.publish.outputs.sha }}
          CI_RESULT: ${{ needs.validation.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: python scripts/codex_automation/pipeline.py report
