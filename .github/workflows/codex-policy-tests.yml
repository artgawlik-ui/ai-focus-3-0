name: Codex automation policy tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests/automation -v

  native-executor-offline:
    # Real pinned CLI/action, but only a synthetic loopback provider. NO secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start root-owned offline gateway
        run: |
          set -euo pipefail
          sudo -n env GITHUB_ACTIONS=true /usr/bin/python3 -m tests.automation.native_executor_stub \
            > "$RUNNER_TEMP/offline-gate.log" 2>&1 &
          probe_pid=$!
          for attempt in {1..20}; do
            if grep -q '^OFFLINE_GATE_READY$' "$RUNNER_TEMP/offline-gate.log"; then exit 0; fi
            kill -0 "$probe_pid" 2>/dev/null || { cat "$RUNNER_TEMP/offline-gate.log"; exit 1; }
            sleep 0.1
          done
          exit 1
      - name: Exercise pinned Codex with synthetic provider only
        id: offline
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: 'offline-dummy-no-real-key'
          responses-api-endpoint: 'http://127.0.0.1:8765/responses'
          codex-version: '0.167.0'
          codex-args: '["-c","web_search=\"disabled\""]'
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: false
          model: 'gpt-5.1-codex-mini'
          prompt: 'Offline protocol test. Reply OFFLINE_EXECUTOR_PASS. Do not use tools or edit files.'
      - name: Read safe offline protocol diagnostics
        if: always()
        run: cat "$RUNNER_TEMP/offline-gate.log"
      - name: Verify response, privilege separation and blocked next request
        env:
          OFFLINE_FINAL: ${{ steps.offline.outputs.final-message }}
        run: |
          test "$OFFLINE_FINAL" = 'OFFLINE_EXECUTOR_PASS'
          test ! -r /run/focus-codex-offline-probe/ledger.json
          if sudo -n true 2>/dev/null; then exit 1; fi
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          body = b'{"model":"gpt-5.1-codex-mini","input":"offline"}'
          try:
              urlopen(Request('http://127.0.0.1:8765/responses', data=body,
                              headers={'Content-Type':'application/json'}), timeout=3)
              raise AssertionError('Quota bypass')
          except HTTPError as error:
              assert error.code == 429
              assert b'REQUEST_LIMIT' in error.read()
          print('OFFLINE_NATIVE_BOUNDARY_PASS')
          PY
